<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Usage Monitor — Current Design & Hover Mockup</title>
  <style>
    :root {
      --bg-canvas: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-muted: #f1f5f9;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-faint: #94a3b8;
      --accent: #1d6ff2;
      --accent-soft: #e0edff;
      --btn-primary-fg: #ffffff;
      --shadow-float: 0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 4px 10px -4px rgba(15, 23, 42, 0.06);
      --statusbar-bg: #f1f5f9;
      --statusbar-text: #334155;
      --font-sans: "Sukhumvit Set", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    html[data-theme="dark"] {
      --bg-canvas: #0e1726;
      --bg-subtle: #111c2d;
      --bg-muted: #172438;
      --border: #1e2d42;
      --border-strong: #2b3f5c;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-faint: #64748b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --btn-primary-fg: #09111c;
      --shadow-float: 0 16px 36px rgba(0, 0, 0, 0.55);
      --statusbar-bg: #09111c;
      --statusbar-text: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: var(--bg-muted);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-frame {
      max-width: 1180px;
      margin: 1.5rem auto;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: visible;
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      min-height: 760px;
    }

    /* Top Bar */
    .topbar {
      height: 50px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      border-radius: 12px 12px 0 0;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 600; font-size: 0.9rem; }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .actions { display: flex; gap: 0.5rem; align-items: center; }

    .btn {
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-primary);
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      color: var(--btn-primary-fg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      flex: 1;
    }
    .workspace-grid.side-hidden { grid-template-columns: 1fr; }
    .workspace-grid.side-hidden .col-main { border-right: none; max-width: 960px; margin: 0 auto; width: 100%; }
    .workspace-grid.side-hidden .col-side { display: none; }
    @media (max-width: 820px) {
      .workspace-grid { grid-template-columns: 1fr; }
    }

    .col-main {
      padding: 1.5rem 2rem 2rem;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .page-header { display: flex; justify-content: space-between; align-items: baseline; }
    .page-title { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .meta-time { font-size: 0.76rem; color: var(--text-secondary); font-family: var(--font-mono); }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .kpi-cell {
      padding: 0.9rem 1.1rem;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .kpi-cell:first-child { padding-left: 0.25rem; }
    .kpi-cell:last-child { border-right: none; }
    .kpi-ring { width: 46px; height: 46px; flex-shrink: 0; transform: rotate(-90deg); }
    .kpi-ring-bg { fill: none; stroke: var(--bg-muted); stroke-width: 5; }
    .kpi-ring-fill { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
    .kpi-ring-fill.warn { stroke: #f59e0b; }
    .kpi-ring-fill.ok { stroke: #10b981; }
    .kpi-info { min-width: 0; }
    .kpi-label { font-size: 0.72rem; color: var(--text-secondary); }
    .kpi-num-row { display: flex; align-items: baseline; gap: 0.3rem; margin: 0.12rem 0 0.08rem; }
    .kpi-num { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .kpi-unit { font-size: 0.72rem; color: var(--text-secondary); font-family: var(--font-mono); }
    .kpi-sub { font-size: 0.71rem; color: var(--text-secondary); }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; gap: 0.75rem; }
    .section-title { font-size: 0.9rem; font-weight: 600; }
    .section-actions { display: flex; gap: 0.4rem; align-items: center; }

    .collapsible-block {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-subtle);
      overflow: hidden;
    }
    .collapsible-header {
      width: 100%;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .collapsible-header:hover { background: var(--bg-muted); }
    .collapsible-title-group { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .collapsible-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary); }
    .collapsible-body { padding: 0 1rem 1rem; border-top: 1px solid var(--border); background: var(--bg-canvas); }
    .collapsible-body.collapsed { display: none; }
    .provider-filter-tabs { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .filter-tab {
      padding: 0.24rem 0.65rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-family: var(--font-sans);
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .filter-tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .provider-group { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1rem; }
    .provider-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }
    .provider-group-name { font-size: 0.86rem; font-weight: 600; display: flex; align-items: center; gap: 0.45rem; }
    .provider-code-pill {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.1rem 0.38rem;
      border-radius: 4px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
    }
    .upcoming-row {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-secondary);
      font-size: 0.78rem;
    }
    .btn-ghost {
      padding: 0.22rem 0.55rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-family: var(--font-sans);
      border: 1px solid var(--border);
      background: var(--bg-canvas);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text-primary); }

    .range-tabs { display: flex; gap: 0.3rem; }
    .range-tab {
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .range-tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .bars-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.85rem;
      align-items: end;
      height: 140px;
      padding-bottom: 1.6rem;
      border-bottom: 1px solid var(--border);
      margin-top: 0.75rem;
    }
    .bar-col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
    .bar-cap { width: 100%; background: var(--bg-muted); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; height: 100%; }
    .bar-fill { width: 100%; background: var(--accent); border-radius: 8px; opacity: 0.82; }
    .bar-label { position: absolute; bottom: -1.45rem; font-size: 0.7rem; color: var(--text-secondary); font-family: var(--font-mono); }

    .compact-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .window-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: var(--bg-subtle);
    }
    .wc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .wc-title { font-size: 0.92rem; font-weight: 600; }
    .wc-badge { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary); }
    .wc-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.25rem; align-items: end; }
    .limit-primary-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
    .limit-secondary-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.95rem; font-weight: 600; }
    .q-track-lg { height: 6px; width: 100%; background: var(--bg-muted); border-radius: 999px; overflow: hidden; }
    .q-fill.warn { background: #f59e0b; }

    .col-side { padding: 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .provider-stack { border-top: 1px solid var(--border); }
    .provider-block { padding: 0.9rem 0.25rem; border-bottom: 1px solid var(--border); }
    .provider-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .pr-left { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
    .pr-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .pr-name { font-size: 0.84rem; font-weight: 600; }
    .pr-sub { font-size: 0.72rem; color: var(--text-secondary); }
    .pr-pct { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; }
    .badge-soon {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--bg-subtle);
    }

    .pool-list { margin-top: 0.7rem; padding-left: 2.5rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .pool-head { display: flex; justify-content: space-between; font-size: 0.73rem; margin-bottom: 0.22rem; }
    .pool-name { color: var(--text-secondary); }
    .pool-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .q-track { height: 4px; width: 100%; background: var(--bg-muted); border-radius: 999px; overflow: hidden; }
    .q-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }

    /* Status Bar & Clean Progress-Bar Hover Panel */
    .vs-statusbar {
      background: var(--statusbar-bg);
      border-top: 1px solid var(--border);
      padding: 0.35rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-family: var(--font-mono);
      color: var(--statusbar-text);
      border-radius: 0 0 12px 12px;
      position: relative;
    }
    .sb-right { display: flex; align-items: center; gap: 0.9rem; }
    .sb-pill {
      position: relative;
      padding: 0.16rem 0.55rem;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    .hover-panel {
      display: none;
      position: absolute;
      bottom: 34px;
      right: 0;
      width: 300px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow-float);
      color: var(--text-primary);
      font-family: var(--font-sans);
      z-index: 50;
      overflow: hidden;
    }
    .sb-pill:hover .hover-panel,
    .sb-pill.pinned .hover-panel {
      display: block;
    }
    .hp-header {
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hp-title { font-size: 0.82rem; font-weight: 700; letter-spacing: -0.01em; }
    .hp-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-faint);
      border: 1px solid var(--border);
      padding: 0.06rem 0.35rem;
      border-radius: 4px;
    }
    .hp-body {
      padding: 0.7rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    /* pool section */
    .hp-pool { }
    .hp-pool-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    /* primary metric row: big % + reset */
    .hp-metric-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }
    .hp-pct {
      font-size: 1.45rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .hp-pct-unit { font-size: 0.8rem; font-weight: 400; color: var(--text-secondary); margin-left: 0.1rem; }
    .hp-reset {
      font-size: 0.68rem;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    /* progress track */
    .hp-track {
      height: 5px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .hp-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .hp-fill.low  { background: #f59e0b; }
    /* secondary weekly row */
    .hp-secondary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.69rem;
      color: var(--text-secondary);
    }
    .hp-secondary-val { font-variant-numeric: tabular-nums; }
    /* divider between pools */
    .hp-divider { height: 1px; background: var(--border); margin: 0; }
    /* actions footer */
    .hp-actions {
      padding: 0.5rem 0.9rem;
      border-top: 1px solid var(--border);
      background: var(--bg-subtle);
      display: flex;
      gap: 1rem;
      font-size: 0.72rem;
      align-items: center;
    }
    .hp-link {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      padding: 0;
    }
    .hp-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="app-frame">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 256 256" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="256" height="256" rx="52" fill="#0e1726"/>
            <path d="M 148.94 86.78 L 166.15 47.06 A 86.00 86.00 0 0 1 193.02 65.50 L 162.80 96.65 A 46.00 46.00 0 0 0 148.94 86.78 Z" fill="#1f2e42" stroke="#1f2e42" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 169.39 104.58 L 205.33 81.27 A 86.00 86.00 0 0 1 213.89 112.71 L 173.94 119.82 A 46.00 46.00 0 0 0 169.39 104.58 Z" fill="#1f2e42" stroke="#1f2e42" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 173.94 136.18 L 213.89 143.29 A 86.00 86.00 0 0 1 205.33 174.73 L 169.39 151.42 A 46.00 46.00 0 0 0 173.94 136.18 Z" fill="#1f2e42" stroke="#1f2e42" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 162.80 159.35 L 193.02 190.50 A 86.00 86.00 0 0 1 166.15 208.94 L 148.94 169.22 A 46.00 46.00 0 0 0 162.80 159.35 Z" fill="#1d6ff2" stroke="#1d6ff2" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 136.32 173.24 L 143.55 212.60 A 86.00 86.00 0 0 1 112.45 212.60 L 119.68 173.24 A 46.00 46.00 0 0 0 136.32 173.24 Z" fill="#1d6ff2" stroke="#1d6ff2" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 107.06 169.22 L 89.85 208.94 A 86.00 86.00 0 0 1 62.98 190.50 L 93.20 159.35 A 46.00 46.00 0 0 0 107.06 169.22 Z" fill="#1d6ff2" stroke="#1d6ff2" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 86.61 151.42 L 50.67 174.73 A 86.00 86.00 0 0 1 42.11 143.29 L 82.06 136.18 A 46.00 46.00 0 0 0 86.61 151.42 Z" fill="#10b981" stroke="#10b981" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 82.06 119.82 L 42.11 112.71 A 86.00 86.00 0 0 1 50.67 81.27 L 86.61 104.58 A 46.00 46.00 0 0 0 82.06 119.82 Z" fill="#10b981" stroke="#10b981" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 93.20 96.65 L 62.98 65.50 A 86.00 86.00 0 0 1 89.85 47.06 L 107.06 86.78 A 46.00 46.00 0 0 0 93.20 96.65 Z" fill="#10b981" stroke="#10b981" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 119.68 82.76 L 112.45 43.40 A 86.00 86.00 0 0 1 143.55 43.40 L 136.32 82.76 A 46.00 46.00 0 0 0 119.68 82.76 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="10" stroke-linejoin="round"/>
          </svg>
        </div>
        <span>AI Usage Monitor</span>
      </div>
      <div class="actions">
        <button class="btn" onclick="toggleHoverPin()" id="pinHoverBtn">Pin Hover Preview</button>
        <button class="btn" onclick="toggleTheme()" id="themeBtn">Light</button>
        <button class="btn" onclick="toggleSide()" id="sideToggleBtn">Providers</button>
        <button class="btn btn-primary" onclick="simulateRefresh()">Refresh</button>
      </div>
    </header>

    <div class="workspace-grid side-hidden" id="workspaceGrid">
      <main class="col-main">
        <div class="page-header">
          <h1 class="page-title">Limit Status</h1>
          <span class="meta-time" id="updatedAt">Updated 10:14:00</span>
        </div>

        <div class="kpi-strip" id="kpiGlance"></div>

        <div>
          <div class="section-header" style="margin-bottom:0.5rem;">
            <div class="section-title">Provider Quota Limits</div>
          </div>
          <div class="provider-filter-tabs" id="providerFilterTabs"></div>
          <div class="compact-list" id="quotaBreakdown"></div>
        </div>

        <div class="collapsible-block">
          <div class="collapsible-header" onclick="toggleHistory()">
            <div class="collapsible-title-group">
              <span class="section-title">Usage History Dashboard</span>
              <span class="collapsible-meta" id="historyMeta">5 snapshots</span>
            </div>
            <div class="section-actions">
              <button class="btn-ghost" onclick="event.stopPropagation(); clearHistory()">Clear History</button>
              <button class="btn-ghost" onclick="event.stopPropagation(); toggleHistory()" id="historyToggleBtn">Open Graph</button>
            </div>
          </div>
          <div class="collapsible-body collapsed" id="historyBody">
            <div class="section-header" style="margin-top:0.75rem;margin-bottom:0;">
              <div class="pr-sub">Historical usage trend</div>
              <div class="range-tabs">
                <button class="range-tab active">24H</button>
                <button class="range-tab">7D</button>
                <button class="range-tab">30D</button>
              </div>
            </div>
            <div class="bars-row" id="barsRow"></div>
          </div>
        </div>
      </main>

      <aside class="col-side">
        <div>
          <div class="section-header">
            <div class="section-title">Providers</div>
            <button class="btn-ghost" onclick="toggleSide()">Close</button>
          </div>
          <div class="provider-stack" id="providerStack"></div>
        </div>
      </aside>
    </div>

    <footer class="vs-statusbar">
      <div>main* • Hover the right pill (or click "Pin Hover Preview")</div>
      <div class="sb-right">
        <span>Ln 1, Col 1</span>
        <div class="sb-pill pinned" id="sbPill">
          <span id="sbText">AGY: G 72%</span>
          <div class="hover-panel">
            <div class="hp-header">
              <span class="hp-title">AI Usage</span>
              <span class="hp-tag">Antigravity · Exact</span>
            </div>
            <div class="hp-body" id="hpBody"></div>
            <div class="hp-actions">
              <button class="hp-link" onclick="simulateRefresh()">↻ Refresh</button>
              <button class="hp-link" onclick="toggleHoverPin()">Close</button>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const agyPools = [
      { name: 'Gemini Models', fiveH: 72, weekly: 51, reset5h: 'in 4h 26m · 14:39', resetWk: 'in 5d 13h · Dec 1, 23:48' },
      { name: 'Claude and GPT models', fiveH: 100, weekly: 49, reset5h: 'in 4h 59m · 15:12', resetWk: 'in 6d 5h · Dec 2, 15:45' }
    ];
    let historyPts = [
      { time: '09:50', pct: 96 },
      { time: '09:55', pct: 91 },
      { time: '10:00', pct: 88 },
      { time: '10:05', pct: 86 },
      { time: '10:10', pct: 86 }
    ];

    function render() {
      const geminiPool = agyPools[0];
      const claudeUsed5h = 45;
      const claudeUsedWk = 80;
      document.getElementById('sbText').textContent = `AGY: G ${geminiPool.fiveH}% | CL ${claudeUsed5h}% used`;

      function renderRing(pct, tone) {
        const r = 18;
        const c = 2 * Math.PI * r;
        const offset = c - (Math.max(0, Math.min(100, pct)) / 100) * c;
        return `<svg class="kpi-ring" viewBox="0 0 46 46"><circle class="kpi-ring-bg" cx="23" cy="23" r="${r}"></circle><circle class="kpi-ring-fill ${tone || ''}" cx="23" cy="23" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"></circle></svg>`;
      }

      document.getElementById('kpiGlance').innerHTML = `
        <div class="kpi-cell">
          ${renderRing(geminiPool.fiveH, geminiPool.fiveH <= 20 ? 'warn' : 'ok')}
          <div class="kpi-info">
            <div class="kpi-label">Antigravity · Gemini (5h)</div>
            <div class="kpi-num-row"><span class="kpi-num">${geminiPool.fiveH}%</span><span class="kpi-unit">left</span></div>
            <div class="kpi-sub">Resets ${geminiPool.reset5h}</div>
          </div>
        </div>
        <div class="kpi-cell">
          ${renderRing(claudeUsed5h, claudeUsed5h >= 80 ? 'warn' : '')}
          <div class="kpi-info">
            <div class="kpi-label">Claude Code (5h)</div>
            <div class="kpi-num-row"><span class="kpi-num">${claudeUsed5h}%</span><span class="kpi-unit">used</span></div>
            <div class="kpi-sub">Weekly ${claudeUsedWk}% used</div>
          </div>
        </div>
        <div class="kpi-cell">
          ${renderRing(67, '')}
          <div class="kpi-info">
            <div class="kpi-label">Active Providers</div>
            <div class="kpi-num-row"><span class="kpi-num">2 / 3</span><span class="kpi-unit">live</span></div>
            <div class="kpi-sub">Antigravity, Claude Code</div>
          </div>
        </div>
      `;

      // Hover Panel — Gemini-only, friendly colors (no harsh red)
      function fillClass(pct) {
        if (pct <= 20) return 'low';
        return '';
      }
      document.getElementById('hpBody').innerHTML = `
        <div class="hp-pool">
          <div class="hp-pool-label">${geminiPool.name}</div>
          <div class="hp-metric-row">
            <div>
              <span class="hp-pct">${geminiPool.fiveH}</span><span class="hp-pct-unit">% left · 5h</span>
            </div>
            <div class="hp-reset">${geminiPool.reset5h}</div>
          </div>
          <div class="hp-track"><div class="hp-fill ${fillClass(geminiPool.fiveH)}" style="width:${geminiPool.fiveH}%"></div></div>
          <div class="hp-secondary">
            <span>Weekly</span>
            <span class="hp-secondary-val">${geminiPool.weekly}%</span>
          </div>
          <div class="hp-track" style="margin-top:0.3rem"><div class="hp-fill ${fillClass(geminiPool.weekly)}" style="width:${geminiPool.weekly}%;opacity:0.55"></div></div>
        </div>
      `;

      // Dynamic Multi-Provider Quota Limits
      let activeProviderFilter = window._providerFilter || 'all';
      const mockProviders = [
        { id: 'agy', shortCode: 'AG', name: 'Antigravity', status: 'live', sourceKind: 'Exact', pools: agyPools },
        { id: 'claude', shortCode: 'CL', name: 'Claude Code', status: 'coming_soon', sourceKind: 'Coming soon', pools: [] },
        { id: 'codex', shortCode: 'CX', name: 'Codex', status: 'coming_soon', sourceKind: 'Coming soon', pools: [] }
      ];
      document.getElementById('historyMeta').textContent = historyPts.length + ' snapshots';
      const tabsEl = document.getElementById('providerFilterTabs');
      tabsEl.innerHTML = [{ id: 'all', name: `All (${mockProviders.length})` }, ...mockProviders].map(item => `
        <button class="filter-tab ${activeProviderFilter === item.id ? 'active' : ''}" onclick="setProviderFilter('${item.id}')">${item.name}</button>
      `).join('');

      const visible = activeProviderFilter === 'all' ? mockProviders : mockProviders.filter(p => p.id === activeProviderFilter);
      document.getElementById('quotaBreakdown').innerHTML = visible.map(s => {
        if (s.status !== 'live') {
          return `<div class="upcoming-row"><div><strong>${s.name}</strong> · Planned integration slot ready</div><span class="badge-soon">Coming soon</span></div>`;
        }
        return `<div class="provider-group">
          <div class="provider-group-head">
            <div class="provider-group-name"><span class="provider-code-pill">${s.shortCode}</span><span>${s.name}</span></div>
            <span class="wc-badge">${s.sourceKind}</span>
          </div>
          ${s.pools.map(p => `
            <div class="window-card">
              <div class="wc-head">
                <div class="wc-title">${p.name}</div>
                <span class="wc-badge">Effective: ${p.fiveH}%</span>
              </div>
              <div class="wc-grid">
                <div>
                  <div class="pool-head"><span class="pool-name">5h Limit (Usable now)</span><span class="limit-primary-val">${p.fiveH}%</span></div>
                  <div class="q-track-lg"><div class="q-fill ${p.fiveH <= 20 ? 'warn' : ''}" style="width:${p.fiveH}%"></div></div>
                  <div class="pr-sub" style="margin-top:0.3rem;">Resets ${p.reset5h}</div>
                </div>
                <div>
                  <div class="pool-head"><span class="pool-name">Weekly Limit</span><span class="limit-secondary-val">${p.weekly}%</span></div>
                  <div class="q-track"><div class="q-fill ${p.weekly <= 20 ? 'warn' : ''}" style="width:${p.weekly}%"></div></div>
                  <div class="pr-sub" style="margin-top:0.3rem;">Resets ${p.resetWk}</div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>`;
      }).join('');

      // Right Provider Stack
      const avg = Math.round((agyPools[0].fiveH + agyPools[1].fiveH) / 2);
      document.getElementById('providerStack').innerHTML = `
        <div class="provider-block">
          <div class="provider-row">
            <div class="pr-left">
              <div class="pr-icon">AG</div>
              <div><div class="pr-name">Antigravity</div><div class="pr-sub">Exact</div></div>
            </div>
            <span class="pr-pct">${avg}%</span>
          </div>
          <div class="pool-list">
            ${agyPools.map(p => `
              <div>
                <div class="pool-head"><span class="pool-name">${p.name}</span><span class="pool-val">${p.fiveH}%</span></div>
                <div class="q-track"><div class="q-fill" style="width:${p.fiveH}%"></div></div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="provider-block">
          <div class="provider-row">
            <div class="pr-left"><div class="pr-icon">CL</div><div><div class="pr-name">Claude Code</div><div class="pr-sub">Not yet configured</div></div></div>
            <span class="badge-soon">Coming soon</span>
          </div>
        </div>
        <div class="provider-block">
          <div class="provider-row">
            <div class="pr-left"><div class="pr-icon">CX</div><div><div class="pr-name">Codex</div><div class="pr-sub">Not yet configured</div></div></div>
            <span class="badge-soon">Coming soon</span>
          </div>
        </div>
      `;

      // History Bars
      const barsEl = document.getElementById('barsRow');
      if (historyPts.length === 0) {
        barsEl.innerHTML = '<div class="pr-sub">No history recorded yet.</div>';
      } else {
        barsEl.innerHTML = historyPts.map(pt => `
          <div class="bar-col">
            <div class="bar-cap"><div class="bar-fill" style="height:${pt.pct}%"></div></div>
            <span class="bar-label">${pt.time}</span>
          </div>
        `).join('');
      }
    }

    function toggleHoverPin() {
      const pill = document.getElementById('sbPill');
      const pinned = pill.classList.toggle('pinned');
      document.getElementById('pinHoverBtn').textContent = pinned ? 'Unpin Hover Preview' : 'Pin Hover Preview';
    }

    function toggleSide() {
      const grid = document.getElementById('workspaceGrid');
      const hidden = grid.classList.toggle('side-hidden');
      document.getElementById('sideToggleBtn').textContent = hidden ? 'Providers' : 'Hide Providers';
    }

    function setProviderFilter(id) {
      window._providerFilter = id;
      render();
    }

    function toggleHistory() {
      const body = document.getElementById('historyBody');
      const collapsed = body.classList.toggle('collapsed');
      document.getElementById('historyToggleBtn').textContent = collapsed ? 'Open Graph' : 'Hide Graph';
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeBtn').textContent = isDark ? 'Dark' : 'Light';
    }

    function clearHistory() {
      historyPts = [];
      render();
    }

    function simulateRefresh() {
      agyPools[0].fiveH = Math.max(0, agyPools[0].fiveH - 4);
      const now = new Date();
      const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      historyPts.push({ time: hhmm, pct: Math.round((agyPools[0].fiveH + agyPools[1].fiveH) / 2) });
      historyPts = historyPts.slice(-7);
      document.getElementById('updatedAt').textContent = 'Updated ' + now.toTimeString().slice(0, 8);
      render();
    }

    render();
  </script>
</body>
</html>
