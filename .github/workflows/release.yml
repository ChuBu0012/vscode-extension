name: Release QuotaDeck

on:
  push:
    tags:
      - "quotadeck-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify types, tests, and package
        working-directory: extensions/quotadeck
        run: |
          bunx tsc --noEmit
          bunx tsc -p src/ui/webview/tsconfig.json --noEmit
          bun test
          bun run package

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: extensions/quotadeck/*.vsix

      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bunx ovsx publish extensions/quotadeck/*.vsix -p "$OVSX_PAT"

      - name: Publish to Visual Studio Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --packagePath extensions/quotadeck/*.vsix -p "$VSCE_PAT"
