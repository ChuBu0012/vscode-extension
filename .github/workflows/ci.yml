name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quotadeck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck extension host and webview
        working-directory: extensions/quotadeck
        run: |
          bunx tsc --noEmit
          bunx tsc -p src/ui/webview/tsconfig.json --noEmit

      - name: Run unit tests
        working-directory: extensions/quotadeck
        run: bun test

      - name: Package VSIX
        working-directory: extensions/quotadeck
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: quotadeck-vsix
          path: extensions/quotadeck/*.vsix
